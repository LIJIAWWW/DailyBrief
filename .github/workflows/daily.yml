name: Daily Brief

# Beijing 08:00, with recovery attempts if GitHub delays/drops a trigger.
# A completed report suppresses recovery attempts; manual runs refresh.
on:
  schedule:
    - cron: '0,30 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'lib/**'
      - 'scripts/**'
      - 'sources.config.json'
      - 'package*.json'

permissions:
  contents: write

concurrency:
  group: daily-brief-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_AI: 'false'
      REPORT_LOCALE: zh
      REPORT_TZ: Asia/Shanghai
      REPORT_THEME: brown
      WEB_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore archive and check completed edition
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C daily_reports
          fi
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ "$EVENT_NAME" = schedule ] && [ -f "daily_reports/$TODAY/$TODAY.html" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Today's edition already exists; skipping recovery run."
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked dependencies
        if: steps.edition.outputs.run == 'true'
        run: npm ci
      - name: Validate configuration and types
        if: steps.edition.outputs.run == 'true'
        run: |
          npm run sources:check
          npx tsc --noEmit
      - name: Fetch AI and financial news (no model API)
        if: steps.edition.outputs.run == 'true'
        run: npm run daily
      - name: Build latest edition and archive
        if: steps.edition.outputs.run == 'true'
        run: npm run build-site
      - name: Publish to gh-pages
        if: steps.edition.outputs.run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'daily: AI and finance edition ${{ github.run_id }}'
